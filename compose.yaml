# Standalone/local deployment. Production runs from the server's stack repository.
name: yourls
services:
  yourls-apache:
    container_name: yourls-apache
    # Official image, rebuilt upstream for every PHP release. Pin the YOURLS
    # version; bump deliberately (see README "Updating YOURLS").
    image: yourls:1.10.6-apache
    restart: always
    depends_on:
      - yourls-mysql
    ports:
      - 80:8080
    env_file: .env
    volumes:
      - ./www:/var/www/html
      - ./vhost.conf:/etc/apache2/sites-available/000-default.conf
      - ./php-security.ini:/usr/local/etc/php/conf.d/zz-security.ini:ro
  yourls-mysql:
    container_name: yourls-mysql
    # LTS. Data from 8.0 must go through 8.4 first; 9.x has no mysql_native_password.
    image: mysql:9.7
    restart: always
    env_file: .env
    volumes:
      - db:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
volumes:
    db:
