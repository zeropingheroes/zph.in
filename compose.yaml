name: yourls
services:
  yourls-apache:
    container_name: yourls-apache
    image: yourls:1.10-apache
    restart: always
    depends_on:
      - yourls-mysql
    ports:
      - 80:8080
    env_file: .env
    volumes:
      - ./www:/var/www/html
      - ./vhost.conf:/etc/apache2/sites-available/000-default.conf
  yourls-mysql:
    container_name: yourls-mysql
    image: mysql
    restart: always
    env_file: .env
    volumes:
      - db:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
volumes:
    db:
